name: Build Fyzonitens Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar Java 21 (JDK 21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compilar Plugin com Maven
      run: mvn -B package --file pom.xml

    - name: Disponibilizar Ficheiro .jar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Fyzonitens-Plugin
        path: target/*.jar
